name: Publish extension
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source directory / 源目录 / ソースディレクトリ'
        required: true
      tag:
        description: 'New immutable tag / 新标签 / 新しいタグ'
        required: true
      notes:
        description: 'Trilingual notes file / 三语说明文件 / 三言語の説明ファイル'
        required: true
        default: 'templates/release-notes.md'
permissions:
  contents: write
concurrency:
  group: community-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple -r requirements-dev.txt
      - run: npm ci --registry=https://registry.npmmirror.com
      - run: python tools/retromao.py check
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Publish and verify Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          REPOSITORY: ${{ github.repository }}
        run: python tools/retromao.py publish "$SOURCE" --tag "$TAG" --repository "$REPOSITORY" --notes "$NOTES"
      - name: Commit verified catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json plugins/index.json
          git commit -m "Publish verified extension catalog"
          git push origin HEAD
