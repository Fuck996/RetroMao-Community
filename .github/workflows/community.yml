name: Community checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        include:
          - os: ubuntu-24.04
            # Match the lockfile and use the image's preinstalled browser dependencies.
            image: mcr.microsoft.com/playwright:v1.56.1-noble-amd64@sha256:42f02d323c310069b4d54c94bd91a608966a486c3492c48ae0b1cea747ec5ca2
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image || '' }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple -r requirements-dev.txt
      - run: npm ci --registry=https://registry.npmmirror.com
      - run: python tools/retromao.py check
      - name: Check immutable API history
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: python tools/check_api.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: npm test
      - run: npm run test:browser
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: preview-evidence
          path: reports/
          if-no-files-found: ignore
