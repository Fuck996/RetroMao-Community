name: Community checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple -r requirements-dev.txt
      - run: npm ci --registry=https://registry.npmmirror.com
      - run: python tools/retromao.py check
      - name: Check immutable API history
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: python tools/check_api.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: npm test
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:browser
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: preview-evidence
          path: reports/
          if-no-files-found: ignore
