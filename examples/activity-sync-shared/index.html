<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RetroMao</title><link rel="stylesheet" href="page.css"></head>
<body><main>
  <header><img src="icon.png" alt="" width="56" height="56"><div><p id="author" class="muted"></p><h1 id="title"></h1></div></header>
  <section class="layout">
    <article class="connection"><p id="help"></p><label for="source" id="sourceLabel"></label><select id="source" disabled></select><p id="connectionHint" class="muted"></p>
      <div class="actions"><button id="sync" disabled></button><button id="cancel" hidden></button></div><p id="privacy" class="muted"></p>
    </article>
    <article><p id="status" role="status" aria-live="polite"></p><progress id="progress" hidden></progress><p id="error" role="alert"></p><p id="last" class="muted"></p>
      <dl><div><dt id="localLabel"></dt><dd id="localCount">—</dd></div><div><dt id="updatedLabel"></dt><dd id="updated">—</dd></div><div><dt id="uploadedLabel"></dt><dd id="uploaded">—</dd></div></dl>
      <details id="unmatched" hidden><summary id="unmatchedLabel" tabindex="0"></summary><p id="retained" class="muted"></p><ul id="games"></ul></details><p id="skipped" class="muted"></p>
    </article>
  </section>
</main><script src="mode.js"></script><script src="strings.js"></script><script src="page.js"></script></body></html>
