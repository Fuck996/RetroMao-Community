<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetroMao Preview</title>
<style>
  :root{color-scheme:dark;font:16px system-ui;color:#edf2f7;background:#11161e}body{margin:0}header{padding:18px 24px;background:#202936;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}label{display:flex;gap:8px;align-items:center}select,input,button{font:inherit;padding:9px;border:1px solid #526275;border-radius:6px;background:#18212d;color:inherit;min-height:44px;box-sizing:border-box}button{cursor:pointer}main{padding:24px;overflow:auto}#notice{margin:0;padding:12px 24px;color:#c9d7e8;background:#172333}iframe{display:block;border:1px solid #526275;max-width:none;margin:auto;background:#171b24}table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{border-bottom:1px solid #3b4a5d;text-align:left;padding:12px;overflow-wrap:anywhere;vertical-align:top}th{color:#9cd8cf}pre{white-space:pre-wrap;overflow-wrap:anywhere}#search{width:min(600px,100%);margin-bottom:20px}#error{color:#ffaaaa}a{color:#9cd8cf}:focus-visible{outline:3px solid #9cd8cf;outline-offset:3px}
</style></head><body>
<header><h1 id="heading"></h1><label><span id="localeLabel"></span><select id="locale"><option value="zh-Hans">简体中文</option><option value="en">English</option><option value="ja">日本語</option></select></label><label id="pageControl"><span id="pageLabel"></span><select id="page"></select></label><label id="sizeControl"><span id="sizeLabel"></span><select id="size"><option value="1280,720">16:9 · 1280×720</option><option value="960,720">4:3 · 960×720</option><option value="720,720">1:1 · 720×720</option></select></label></header>
<p id="notice"></p><main><p id="error" role="alert"></p><iframe id="frame" title="Plugin preview" hidden></iframe><section id="details" hidden><input id="search" type="search"><p id="summary"></p><table><thead id="thead"></thead><tbody id="rows"></tbody></table></section></main>
<script>
const text={
 "zh-Hans":{title:"复古猫开发预览",locale:"语言",page:"页面",size:"画布",notice:"本地样本预览：使用正式 SDK，数据与网络为模拟。不能替代 Android、真实网盘或模拟器验收。关闭终端服务请按 Ctrl+C。",search:"搜索键、原文或译文",key:"键 / 上下文",source:"中文原文",translation:"译文",missing:"未翻译",platform:"平台",launch:"启动配置",summary:"条目"},
 en:{title:"RetroMao development preview",locale:"Language",page:"Page",size:"Canvas",notice:"Local fixtures with the shipped SDK. Data and network are simulated. This does not replace Android, cloud or emulator testing. Press Ctrl+C in the terminal to stop the server.",search:"Search keys, source or translation",key:"Key / context",source:"Chinese source",translation:"Translation",missing:"Untranslated",platform:"Platform",launch:"Launch configuration",summary:"entries"},
 ja:{title:"RetroMao 開発プレビュー",locale:"言語",page:"ページ",size:"キャンバス",notice:"正式 SDK とローカルのサンプルデータを使用します。データと通信は模擬です。Android、クラウド、エミュレーターの実機検証は別途必要です。終了するには端末で Ctrl+C を押してください。",search:"キー・原文・訳文を検索",key:"キー / コンテキスト",source:"中国語の原文",translation:"訳文",missing:"未翻訳",platform:"プラットフォーム",launch:"起動設定",summary:"項目"}
};
let data;
const $=id=>document.getElementById(id);
function render(){const t=text[$("locale").value];document.documentElement.lang=$("locale").value;$("heading").textContent=t.title;$("localeLabel").textContent=t.locale;$("pageLabel").textContent=t.page;$("sizeLabel").textContent=t.size;$("notice").textContent=t.notice;$("search").placeholder=t.search;
 if(data.kind==="SCRIPT"){ $("frame").hidden=false;$("details").hidden=true;const page=data.manifest.pages.find(p=>p.id===$("page").value);if(page){const [width,height]=$("size").value.split(",");$("frame").width=width;$("frame").height=height;$("frame").src="/plugin/"+page.path+"?locale="+$("locale").value+"&config="+(page.kind==="CONFIGURATION"?"1":"0");}return;}
 $("frame").hidden=true;$("details").hidden=false;$("pageControl").hidden=true;$("sizeControl").hidden=true;$("rows").replaceChildren();$("thead").replaceChildren();
 const header=document.createElement("tr");for(const value of data.kind==="LANGUAGE"?[t.key,t.source,t.translation]:[t.platform,t.launch]){const cell=document.createElement("th");cell.textContent=value;header.append(cell);}$("thead").append(header);
 const query=$("search").value.toLowerCase();let count=0;
 const entries=data.kind==="LANGUAGE"?Object.entries(data.source.messages).map(([key,value])=>[key+"\n"+(data.context.messages[key]?.surfaces||[]).join(", "),value,data.manifest.messages[key]??t.missing]):[[JSON.stringify(data.platform.platform,null,2),JSON.stringify(data.platform.launchers||[],null,2)]];
 for(const cells of entries){if(!cells.join(" ").toLowerCase().includes(query))continue;const row=document.createElement("tr");for(const value of cells){const cell=document.createElement("td");cell.textContent=value;row.append(cell);}$("rows").append(row);count++;}$("summary").textContent=count+" "+t.summary;}
fetch("/__preview/data.json").then(r=>{if(!r.ok)throw new Error("Preview data unavailable");return r.json();}).then(value=>{data=value;for(const page of data.manifest.pages||[]){const option=document.createElement("option");option.value=page.id;option.textContent=page.title;$("page").append(option);}if(data.kind==="SCRIPT"&&!data.manifest.pages?.length)throw new Error("This plugin has no HTML page. Use the SDK Node tests for background-only/resource plugins.");render();}).catch(error=>$("error").textContent=error.message);
$("locale").onchange=render;$("page").onchange=render;$("size").onchange=render;$("search").oninput=render;
</script></body></html>
